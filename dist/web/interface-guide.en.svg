<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1512 982" width="1512" height="982" role="img" aria-labelledby="t d" font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
  <title id="t">OpenCircuit workspace interface guide</title>
  <desc id="d">Labels the eight workspace areas: project and back, alerts, simulate and upload toolbar, tabs, parts library, circuit canvas, issues and output panel, part details.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#c9d3cd"/>
    </pattern>
    <marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4"><circle cx="4" cy="4" r="3" fill="#1f7a68"/></marker>
  </defs>

  <!-- page -->
  <rect width="1512" height="982" fill="#f4f7f9"/>

  <!-- top bar -->
  <rect x="0" y="0" width="1512" height="60" fill="#fff"/>
  <line x1="0" y1="60" x2="1512" y2="60" stroke="#dce3e8"/>
  <rect x="20" y="13" width="34" height="34" rx="7" fill="#fff" stroke="#c9d3cd"/>
  <text x="37" y="37" font-size="20" text-anchor="middle" fill="#26383f">←</text>
  <rect x="66" y="12" width="36" height="36" rx="8" fill="#183335"/>
  <text x="84" y="37" font-size="20" text-anchor="middle" fill="#fff">⌘</text>
  <text x="112" y="37" font-size="18" font-weight="700" fill="#183335">OpenCircuit</text>
  <text x="238" y="37" font-size="18" fill="#83918d">/</text>
  <rect x="250" y="14" width="128" height="32" rx="6" fill="#fff" stroke="#c9d3cd"/>
  <text x="314" y="36" font-size="14" text-anchor="middle" fill="#26383f">OpenCircuit Lab ▾</text>
  <rect x="423" y="13" width="34" height="34" rx="17" fill="#fdf3dc" stroke="#d99b26"/>
  <text x="440" y="37" font-size="20" font-weight="700" text-anchor="middle" fill="#a8741a">!</text>
  <rect x="1186" y="13" width="75" height="34" rx="7" fill="#fff" stroke="#c9d3cd"/>
  <text x="1223" y="36" font-size="15" text-anchor="middle" fill="#26383f">▶ Simulate</text>
  <rect x="1267" y="13" width="101" height="34" rx="7" fill="#fff" stroke="#c9d3cd"/>
  <text x="1317" y="36" font-size="15" text-anchor="middle" fill="#26383f">Upload</text>
  <rect x="1374" y="13" width="75" height="34" rx="7" fill="#fff" stroke="#c9d3cd"/>
  <text x="1411" y="36" font-size="15" text-anchor="middle" fill="#26383f">Export</text>
  <rect x="1458" y="13" width="34" height="34" rx="7" fill="#fff" stroke="#c9d3cd"/>
  <text x="1475" y="37" font-size="20" text-anchor="middle" fill="#26383f">⋯</text>

  <!-- main tabs -->
  <rect x="0" y="61" width="1512" height="44" fill="#fff"/>
  <line x1="0" y1="105" x2="1512" y2="105" stroke="#dce3e8"/>
  <rect x="40" y="67" width="154" height="34" rx="9" fill="#e3f1ec"/>
  <text x="117" y="90" font-size="17" font-weight="700" text-anchor="middle" fill="#175e50">Circuit</text>
  <text x="294" y="90" font-size="17" text-anchor="middle" fill="#26383f">Materials and cost</text>

  <!-- component library -->
  <rect x="0" y="106" width="250" height="876" fill="#fff"/>
  <line x1="250" y1="106" x2="250" y2="982" stroke="#dce3e8"/>
  <text x="20" y="136" font-size="16" font-weight="700" fill="#267868">Parts</text>
  <rect x="16" y="150" width="218" height="36" rx="8" fill="#f1f3f0"/>
  <text x="30" y="173" font-size="14" fill="#83918d">Search name or model…</text>
  <rect x="16" y="198" width="124" height="32" rx="7" fill="#fff" stroke="#c9d3cd"/>
  <text x="28" y="219" font-size="13" fill="#26383f">All categories ▾</text>
  <text x="18" y="262" font-size="13" font-weight="700" fill="#26383f">Controllers and communication</text>
  <g font-size="13" fill="#26383f">
    <rect x="16" y="276" width="218" height="64" rx="8" fill="#fafbf7" stroke="#e0e6de"/>
    <rect x="26" y="286" width="28" height="44" rx="4" fill="#2c6e5f"/>
    <text x="66" y="304" font-weight="700">ESP32 dev board</text>
    <text x="66" y="324" fill="#83918d" font-size="12">ESP32-DevKitC V4</text>
    <rect x="16" y="348" width="218" height="64" rx="8" fill="#fafbf7" stroke="#e0e6de"/>
    <rect x="26" y="358" width="28" height="44" rx="4" fill="#1d7ea5"/>
    <text x="66" y="376" font-weight="700">Arduino Uno R3</text>
    <text x="66" y="396" fill="#83918d" font-size="12">ATmega328P · 16 MHz</text>
  </g>
  <text x="18" y="446" font-size="13" font-weight="700" fill="#26383f">Sensors and inputs</text>
  <g font-size="13" fill="#26383f">
    <rect x="16" y="460" width="218" height="64" rx="8" fill="#fafbf7" stroke="#e0e6de"/>
    <rect x="26" y="470" width="28" height="44" rx="4" fill="#e9eef2" stroke="#c9d3cd"/>
    <text x="66" y="488" font-weight="700">DHT22 temp/humidity module</text>
    <text x="66" y="508" fill="#83918d" font-size="12">Wiring · with program</text>
    <rect x="16" y="532" width="218" height="64" rx="8" fill="#fafbf7" stroke="#e0e6de"/>
    <rect x="26" y="542" width="28" height="44" rx="4" fill="#e9eef2" stroke="#c9d3cd"/>
    <text x="66" y="560" font-weight="700">Button</text>
    <text x="66" y="580" fill="#83918d" font-size="12">Momentary switch</text>
  </g>
  <text x="18" y="630" font-size="13" font-weight="700" fill="#26383f">Displays and outputs</text>
  <g font-size="13" fill="#26383f">
    <rect x="16" y="644" width="218" height="64" rx="8" fill="#fafbf7" stroke="#e0e6de"/>
    <circle cx="40" cy="676" r="13" fill="#d9534f"/>
    <text x="66" y="672" font-weight="700">LED</text>
    <text x="66" y="692" fill="#83918d" font-size="12">Wiring · with program</text>
  </g>
  <rect x="16" y="932" width="218" height="36" rx="8" fill="#fff" stroke="#c9d3cd"/>
  <text x="125" y="955" font-size="14" text-anchor="middle" fill="#26383f">＋ Custom part / import</text>

  <!-- canvas -->
  <rect x="256" y="106" width="1256" height="47" fill="#fff"/>
  <line x1="256" y1="153" x2="1512" y2="153" stroke="#dce3e8"/>
  <text x="276" y="136" font-size="16" font-weight="700" fill="#26383f">Circuit canvas</text>
  <text x="386" y="136" font-size="14" fill="#83918d">3 parts　5 wires</text>
  <rect x="1316" y="116" width="86" height="28" rx="6" fill="#fff" stroke="#c9d3cd"/>
  <text x="1359" y="135" font-size="13" text-anchor="middle" fill="#26383f">Tidy up</text>
  <rect x="1410" y="116" width="86" height="28" rx="6" fill="#fff" stroke="#c9d3cd"/>
  <text x="1453" y="135" font-size="13" text-anchor="middle" fill="#26383f">Show all</text>
  <rect x="256" y="154" width="1256" height="790" fill="#f1f4f1"/>
  <rect x="256" y="154" width="1256" height="790" fill="url(#grid)"/>

  <!-- circuit mock -->
  <g stroke-linejoin="round" stroke-linecap="round" fill="none" stroke-width="3">
    <polyline points="560,262 640,262 640,200 760,200" stroke="#2f8a6b"/>
    <polyline points="560,290 700,290 700,440 560,440" stroke="#c4574a"/>
    <polyline points="760,200 820,200" stroke="#2f8a6b"/>
  </g>
  <rect x="340" y="226" width="220" height="220" rx="10" fill="#2c6e5f" stroke="#1a463c" stroke-width="3"/>
  <rect x="372" y="262" width="96" height="100" rx="4" fill="#b9c4c9"/>
  <g fill="#e2b73c"><circle cx="352" cy="262" r="4"/><circle cx="352" cy="282" r="4"/><circle cx="352" cy="302" r="4"/><circle cx="548" cy="262" r="4"/><circle cx="548" cy="290" r="4"/><circle cx="548" cy="440" r="4"/></g>
  <text x="450" y="472" font-size="14" text-anchor="middle" fill="#26383f">ESP32 dev board</text>
  <rect x="760" y="186" width="78" height="28" rx="6" fill="#e9d9b6" stroke="#9a8556" stroke-width="2"/>
  <g fill="#b04a3a"><rect x="778" y="186" width="6" height="28"/><rect x="794" y="186" width="6" height="28"/><rect x="810" y="186" width="6" height="28"/></g>
  <text x="799" y="238" font-size="14" text-anchor="middle" fill="#26383f">Resistor</text>
  <polyline points="838,200 880,200 880,420 800,420" fill="none" stroke="#2f8a6b" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="780" cy="420" r="22" fill="#d9534f" stroke="#8a2f2a" stroke-width="2"/>
  <text x="780" y="470" font-size="14" text-anchor="middle" fill="#26383f">LED</text>

  <!-- zoom controls -->
  <rect x="271" y="875" width="28" height="54" rx="4" fill="#fff" stroke="#c9d3cd"/>
  <text x="285" y="895" font-size="16" text-anchor="middle" fill="#26383f">＋</text>
  <text x="285" y="919" font-size="16" text-anchor="middle" fill="#26383f">－</text>

  <!-- floating inspector (appears on selection) -->
  <rect x="340" y="560" width="300" height="200" rx="10" fill="#fff" stroke="#1f7a68" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="358" y="592" font-size="16" font-weight="700" fill="#26383f">Part details</text>
  <rect x="358" y="606" width="264" height="30" rx="6" fill="#f1f3f0"/>
  <text x="370" y="627" font-size="13" fill="#83918d">Name, model, parameters…</text>
  <rect x="358" y="648" width="120" height="30" rx="6" fill="#fff" stroke="#c9d3cd"/>
  <text x="418" y="669" font-size="13" text-anchor="middle" fill="#26383f">Rotate 90°</text>
  <rect x="488" y="648" width="134" height="30" rx="6" fill="#fff" stroke="#c9d3cd"/>
  <text x="555" y="669" font-size="13" text-anchor="middle" fill="#26383f">Resize</text>
  <text x="358" y="716" font-size="13" fill="#6b7a82">Shown after selecting a part</text>

  <!-- bottom panel -->
  <rect x="256" y="944" width="1256" height="38" fill="#fff"/>
  <line x1="256" y1="944" x2="1512" y2="944" stroke="#dce3e8"/>
  <text x="290" y="968" font-size="14" font-weight="700" fill="#175e50">Issues</text>
  <text x="352" y="968" font-size="14" fill="#26383f">Output</text>
  <text x="414" y="968" font-size="14" fill="#26383f">Serial monitor</text>

  <!-- region outlines -->
  <g fill="none" stroke="#1f7a68" stroke-width="3" rx="8">
    <rect x="12" y="7" width="376" height="46" rx="8"/>
    <rect x="416" y="7" width="48" height="46" rx="8"/>
    <rect x="1180" y="7" width="318" height="46" rx="8"/>
    <rect x="32" y="63" width="332" height="40" rx="8"/>
    <rect x="4" y="110" width="242" height="868" rx="8"/>
    <rect x="260" y="158" width="1248" height="782" rx="8" stroke-dasharray="14 8"/>
    <rect x="260" y="947" width="1248" height="33" rx="8"/>
    <rect x="334" y="554" width="312" height="212" rx="12"/>
  </g>

  <!-- badges on the interface -->
  <g font-size="19" font-weight="700" text-anchor="middle" fill="#fff">
    <circle cx="396" cy="30" r="17" fill="#1f7a68"/><text x="396" y="37">1</text>
    <circle cx="486" cy="30" r="17" fill="#1f7a68"/><text x="486" y="37">2</text>
    <circle cx="1160" cy="30" r="17" fill="#1f7a68"/><text x="1160" y="37">3</text>
    <circle cx="384" cy="83" r="17" fill="#1f7a68"/><text x="384" y="90">4</text>
    <circle cx="226" cy="128" r="17" fill="#1f7a68"/><text x="226" y="135">5</text>
    <circle cx="284" cy="186" r="17" fill="#1f7a68"/><text x="284" y="193">6</text>
    <circle cx="1480" cy="963" r="17" fill="#1f7a68"/><text x="1480" y="970">7</text>
    <circle cx="660" cy="574" r="17" fill="#1f7a68"/><text x="660" y="581">8</text>
  </g>

  <!-- legend card on the canvas -->
  <rect x="880" y="170" width="600" height="750" rx="14" fill="#fff" stroke="#1f7a68" stroke-width="2"/>
  <g font-size="21" fill="#26383f">
    <circle cx="916" cy="212" r="17" fill="#1f7a68"/><text x="916" y="219" font-size="19" font-weight="700" text-anchor="middle" fill="#fff">1</text>
    <text x="946" y="219" font-size="27" font-weight="700">Back and project</text>
    <text x="946" y="252" fill="#586a75">Project home; switch or manage projects</text>

    <circle cx="916" cy="284" r="17" fill="#1f7a68"/><text x="916" y="291" font-size="19" font-weight="700" text-anchor="middle" fill="#fff">2</text>
    <text x="946" y="291" font-size="27" font-weight="700">Alerts</text>
    <text x="946" y="324" fill="#586a75">Rule and tool hints; click to see details</text>

    <circle cx="916" cy="356" r="17" fill="#1f7a68"/><text x="916" y="363" font-size="19" font-weight="700" text-anchor="middle" fill="#fff">3</text>
    <text x="946" y="363" font-size="27" font-weight="700">Simulate · Upload · Export</text>
    <text x="946" y="396" fill="#586a75">Compile and simulate, USB upload, export</text>
    <text x="946" y="424" fill="#586a75">“⋯” menu: version history, serial monitor,</text>
    <text x="946" y="452" fill="#586a75">tool settings, undo / redo, apply draft</text>

    <circle cx="916" cy="484" r="17" fill="#1f7a68"/><text x="916" y="491" font-size="19" font-weight="700" text-anchor="middle" fill="#fff">4</text>
    <text x="946" y="491" font-size="27" font-weight="700">Tabs</text>
    <text x="946" y="524" fill="#586a75">Circuit / Materials and cost (BOM, budget)</text>

    <circle cx="916" cy="556" r="17" fill="#1f7a68"/><text x="916" y="563" font-size="19" font-weight="700" text-anchor="middle" fill="#fff">5</text>
    <text x="946" y="563" font-size="27" font-weight="700">Parts library</text>
    <text x="946" y="596" fill="#586a75">Search and click a part to add it;</text>
    <text x="946" y="624" fill="#586a75">or import a custom part</text>

    <circle cx="916" cy="656" r="17" fill="#1f7a68"/><text x="916" y="663" font-size="19" font-weight="700" text-anchor="middle" fill="#fff">6</text>
    <text x="946" y="663" font-size="27" font-weight="700">Circuit canvas</text>
    <text x="946" y="696" fill="#586a75">Drag parts and click pins to wire;</text>
    <text x="946" y="724" fill="#586a75">tidy up, show all, zoom</text>

    <circle cx="916" cy="756" r="17" fill="#1f7a68"/><text x="916" y="763" font-size="19" font-weight="700" text-anchor="middle" fill="#fff">7</text>
    <text x="946" y="763" font-size="27" font-weight="700">Issues · Output · Serial</text>
    <text x="946" y="796" fill="#586a75">Check results, compile output,</text>
    <text x="946" y="824" fill="#586a75">serial messages from device and simulation</text>

    <circle cx="916" cy="856" r="17" fill="#1f7a68"/><text x="916" y="863" font-size="19" font-weight="700" text-anchor="middle" fill="#fff">8</text>
    <text x="946" y="863" font-size="27" font-weight="700">Part details</text>
    <text x="946" y="896" fill="#586a75">Select a part: rename, rotate, size</text>
  </g>
</svg>
